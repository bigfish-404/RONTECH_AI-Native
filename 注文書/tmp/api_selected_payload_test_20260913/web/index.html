<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="app-token" content="__APP_TOKEN__">
  <title>注文書作成ツール</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">注</span>
      <div class="product-name">
        <span class="product-title">注文書</span>
        <span class="product-subtitle">作成ツール</span>
      </div>
    </div>
    <nav class="top-actions" aria-label="主な操作">
      <span id="saveState" class="save-state is-saved"><i></i>更新済み</span>
      <button id="reloadButton" class="button button-secondary" type="button">再読込</button>
      <button id="saveButton" class="button button-secondary" type="button">変更を保存</button>
      <button id="generateButton" class="button button-primary" type="button">注文書を作成</button>
      <span class="top-action-divider" aria-hidden="true"></span>
      <button id="shutdownButton" class="button button-plain shutdown-button" type="button">終了</button>
    </nav>
  </header>

  <main class="page-shell">
    <section class="data-panel panel" aria-labelledby="listTitle">
      <div class="workspace-heading">
        <div class="workspace-controls">
          <label class="month-control compact-month">
            <span>対象年月</span>
            <input id="targetMonth" type="month">
          </label>
          <div class="metrics" aria-label="登録件数">
            <div class="metric"><strong id="companyCount">0</strong><span>会社</span></div>
            <div class="metric"><strong id="projectCount">0</strong><span>案件</span></div>
            <div class="metric"><strong id="engineerCount">0</strong><span>技術者</span></div>
          </div>
          <div class="output-control">
            <button id="selectOutputButton" class="button button-secondary" type="button">出力先を選択</button>
            <span id="outputRootLabel" class="output-root-label" title="既定の成果物フォルダ">既定：成果物</span>
          </div>
          <button id="addCompanyButton" class="button button-secondary add-company" type="button">会社を追加</button>
        </div>
      </div>

      <h1 id="pageTitle" class="visually-hidden">注文データ</h1>
      <h2 id="listTitle" class="visually-hidden">注文一覧</h2>

      <div class="list-toolbar" aria-label="一覧操作">
        <div class="list-selection">
          <span id="displayCount" class="list-count">0件</span>
          <label class="select-visible">
            <input id="selectAll" type="checkbox">
            <span>すべて選択</span>
          </label>
          <button id="clearSelectionButton" class="button button-plain clear-selection" type="button" disabled>選択解除</button>
        </div>
      </div>

      <section id="companyList" class="company-list" aria-label="会社・案件・技術者一覧"></section>
      <section id="emptyState" class="empty-state" hidden>
        <strong>表示するデータがありません</strong>
        <span>「会社を追加」から最初の注文データを登録してください。</span>
      </section>
    </section>

    <section class="result-card panel" aria-live="polite" aria-labelledby="resultTitle">
      <div class="result-copy">
        <h2 id="resultTitle" class="result-label">実行結果</h2>
        <p id="resultMessage">注文データを読み込んでいます。</p>
        <details id="logDetails" hidden>
          <summary>詳しい実行内容</summary>
          <pre id="resultLog"></pre>
        </details>
      </div>
      <button id="openOutputButton" class="button button-secondary" type="button" disabled>成果物フォルダを開く</button>
    </section>
  </main>

  <dialog id="editDialog" class="edit-dialog">
    <form id="editForm" method="dialog">
      <div class="dialog-heading">
        <div>
          <span id="dialogEyebrow" class="dialog-eyebrow"></span>
          <h2 id="dialogTitle"></h2>
          <p id="dialogDescription"></p>
        </div>
        <button id="dialogCloseButton" class="dialog-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div id="dialogBody" class="dialog-body"></div>
      <p id="dialogError" class="dialog-error" hidden></p>
      <div class="dialog-actions">
        <button id="dialogCancelButton" class="button button-secondary" type="button">キャンセル</button>
        <button id="dialogSaveButton" class="button button-primary" type="submit">変更を反映</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
